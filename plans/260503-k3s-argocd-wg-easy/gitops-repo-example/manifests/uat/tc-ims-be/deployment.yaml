apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc-ims-be
  namespace: uat
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: tc-ims-be
      env: uat
  template:
    metadata:
      labels:
        app: tc-ims-be
        env: uat
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: tc-ims-be
          image: YOUR_DOCKERHUB_USERNAME/tc-ims-be:latest
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Staging
            - name: DB_HOST
              value: postgres-uat.data.svc.cluster.local
            - name: REDIS_HOST
              value: redis-uat.data.svc.cluster.local
          envFrom:
            - secretRef:
                name: app-uat-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tc-ims-be
  namespace: uat
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: tc-ims-be
      env: uat
