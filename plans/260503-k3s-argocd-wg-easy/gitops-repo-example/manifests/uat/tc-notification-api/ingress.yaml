apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tc-notification-api
  namespace: uat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: uat-vpn-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - uat-tc-notification-api.company.com
      secretName: uat-tc-notification-api-tls
  rules:
    - host: uat-tc-notification-api.company.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tc-notification-api
                port:
                  number: 80
