apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc-admin-api
  namespace: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: tc-admin-api
      env: dev
  template:
    metadata:
      labels:
        app: tc-admin-api
        env: dev
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: tc-admin-api
          image: YOUR_DOCKERHUB_USERNAME/tc-admin-api:latest
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: DB_HOST
              value: postgres-dev.data.svc.cluster.local
            - name: REDIS_HOST
              value: redis-dev.data.svc.cluster.local
          envFrom:
            - secretRef:
                name: app-dev-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tc-admin-api
  namespace: dev
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: tc-admin-api
      env: dev
