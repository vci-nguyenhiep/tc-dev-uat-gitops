apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tc-hrm-api
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: dev-vpn-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dev-tc-hrm-api.company.com
      secretName: dev-tc-hrm-api-tls
  rules:
    - host: dev-tc-hrm-api.company.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tc-hrm-api
                port:
                  number: 80
