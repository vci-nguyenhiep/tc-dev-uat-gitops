apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-ims
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/infra-gitops.git
    targetRevision: main
    path: environments/dev/ims
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: false       # DEV: cho phép kubectl apply tay
    syncOptions:
      - CreateNamespace=true
