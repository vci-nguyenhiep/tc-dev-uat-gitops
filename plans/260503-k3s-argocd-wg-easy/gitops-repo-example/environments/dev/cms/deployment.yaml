---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms
  namespace: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1   # tối đa 1 pod down khi deploy
      maxSurge: 1         # tối đa 1 pod extra khi deploy
  selector:
    matchLabels:
      app: cms
      env: dev
  template:
    metadata:
      labels:
        app: cms
        env: dev
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: cms
          # CI tự update tag này khi push lên branch develop
          image: 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/cms:latest
          ports:
            - containerPort: 80
          env:
            - name: ENVIRONMENT
              value: development
            - name: DB_HOST
              value: postgres-dev.data.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: devdb
            - name: REDIS_HOST
              value: redis-dev.data.svc.cluster.local
          envFrom:
            - secretRef:
                name: app-dev-secret   # kubectl create secret, không commit vào Git
          # ASP.NET Core health check endpoints (cần enable trong app)
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 15   # .NET startup chậm hơn Node/Go
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: cms
  namespace: dev
spec:
  selector:
    app: cms
    env: dev
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cms
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: dev-vpn-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dev-cms.company.com
      secretName: dev-cms-tls
  rules:
    - host: dev-cms.company.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cms
                port:
                  number: 80

---
# Đảm bảo luôn có ít nhất 1 pod running khi node maintenance / rolling update
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cms
  namespace: dev
spec:
  minAvailable: 0  # dev: cho phép tắt pod khi cần
  selector:
    matchLabels:
      app: cms
      env: dev
