---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-uat-secret
  namespace: data
type: Opaque
stringData:
  POSTGRES_DB: uatdb
  POSTGRES_USER: uatuser
  POSTGRES_PASSWORD: CHANGE_ME_UAT_PASSWORD   # đổi password thực

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-uat-pvc
  namespace: data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-uat
  namespace: data
  labels:
    app: postgres-uat
    env: uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-uat
  template:
    metadata:
      labels:
        app: postgres-uat
        env: uat
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-uat-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "uatuser", "-d", "uatdb"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "uatuser", "-d", "uatdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-uat-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-uat
  namespace: data
  labels:
    env: uat
spec:
  selector:
    app: postgres-uat
  ports:
    - port: 5432
      targetPort: 5432
