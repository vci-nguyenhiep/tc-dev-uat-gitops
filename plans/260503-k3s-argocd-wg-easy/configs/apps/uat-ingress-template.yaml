# Template Ingress cho UAT app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uat-APP_NAME
  namespace: uat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: uat-vpn-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - SUBDOMAIN.company.com     # ví dụ: uat-app.company.com
      secretName: uat-APP_NAME-tls
  rules:
    - host: SUBDOMAIN.company.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: APP_NAME
                port:
                  number: 80
