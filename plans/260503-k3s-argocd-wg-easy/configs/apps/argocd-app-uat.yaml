# ArgoCD Application cho môi trường UAT
# selfHeal=true: giữ đúng trạng thái Git, không cho sửa tay
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uat-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/infra-gitops.git
    targetRevision: main
    path: environments/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true      # UAT: bắt buộc đúng trạng thái Git
    syncOptions:
      - CreateNamespace=true
