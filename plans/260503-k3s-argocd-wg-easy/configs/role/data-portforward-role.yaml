apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-portforward-role
  namespace: data
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/portforward"]
  verbs: ["create", "get"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["services/portforward"]
  verbs: ["create", "get"]
