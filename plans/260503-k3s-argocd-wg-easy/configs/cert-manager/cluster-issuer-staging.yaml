# Dùng staging để test trước — tránh bị rate limit Let's Encrypt
# Cert sẽ không được tin cậy bởi browser nhưng dùng để verify flow hoạt động
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: admin@company.com
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
