# ArgoCD Application — deploy kube-prometheus-stack qua Helm
# Apply sau khi ArgoCD đã chạy: kubectl apply -f monitoring-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 58.2.1
    helm:
      values: |
        grafana:
          adminPassword: CHANGE_ME_GRAFANA_PASSWORD
        prometheus:
          prometheusSpec:
            retention: 7d
        grafana:
          ingress:
            enabled: false   # tự tạo Ingress riêng với VPN middleware
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # cần cho CRDs lớn của prometheus-stack
