apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresh
  namespace: kube-system
spec:
  schedule: "0 */6 * * *"   # Mỗi 6 giờ — token hết hạn sau 12h
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-token-refresh
          restartPolicy: OnFailure
          hostNetwork: true
          containers:
            - name: refresh
              image: amazon/aws-cli:latest
              command:
                - /bin/sh
                - -c
                - |
                  # Lấy ECR token mới
                  TOKEN=$(aws ecr get-login-password --region $AWS_DEFAULT_REGION)

                  # Refresh secret trong từng namespace
                  for NS in dev uat public; do
                    kubectl create secret docker-registry ecr-secret \
                      --namespace $NS \
                      --docker-server=$ECR_REGISTRY \
                      --docker-username=AWS \
                      --docker-password=$TOKEN \
                      --dry-run=client -o yaml | kubectl apply -f -
                    echo "Refreshed ecr-secret in namespace: $NS"
                  done
              envFrom:
                - secretRef:
                    name: aws-ecr-credentials
              volumeMounts:
                - name: kubectl
                  mountPath: /usr/local/bin/kubectl
          volumes:
            - name: kubectl
              hostPath:
                path: /usr/local/bin/kubectl
                type: File