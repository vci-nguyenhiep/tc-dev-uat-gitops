apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: "*"
    helm:
      valueFiles:
        - values.yaml
      values: |
        server:
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "raft" {
                path    = "/vault/data"
                node_id = "vault-0"
              }
              service_registration "kubernetes" {}
          dataStorage:
            enabled: true
            size: 5Gi
            storageClass: local-path
        ui:
          enabled: true
          serviceType: ClusterIP
        injector:
          # Tắt podAntiAffinity mặc định của chart — cluster single-node:
          # RollingUpdate cần pod mới chạy song song pod cũ trên cùng node,
          # anti-affinity REQUIRED chặn schedule → rollout kẹt vĩnh viễn (đã gặp khi chart nâng 1.7.2→1.7.4)
          affinity: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: false    # Không tự xóa — Vault cần unseal thủ công sau redeploy
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Injector runtime tự ghi caBundle (cert) vào webhook config — chart để rỗng
  # → false-diff làm app OutOfSync vĩnh viễn. Bỏ qua đúng field này.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: vault-agent-injector-cfg
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
