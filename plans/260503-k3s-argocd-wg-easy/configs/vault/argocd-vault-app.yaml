apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: "*"
    helm:
      valueFiles:
        - values.yaml
      values: |
        server:
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "raft" {
                path    = "/vault/data"
                node_id = "vault-0"
              }
              service_registration "kubernetes" {}
          dataStorage:
            enabled: true
            size: 5Gi
            storageClass: local-path
        ui:
          enabled: true
          serviceType: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: false    # Không tự xóa — Vault cần unseal thủ công sau redeploy
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
