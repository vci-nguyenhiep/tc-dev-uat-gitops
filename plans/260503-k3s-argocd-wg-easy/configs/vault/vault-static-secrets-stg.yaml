---
# App secrets — dùng chung cho các app trong namespace stg
# (tc-admin-api, tc-hrm-api, tc-gateway, gotenberg)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: app-stg-secret
  namespace: stg
spec:
  vaultAuthRef: stg-auth
  type: kv-v2
  mount: secret
  path: stg/app
  destination:
    name: app-stg-secret
    create: true
  refreshAfter: 60s
---
# Redis — dùng chung path data/redis (cùng instance redis với dev/uat)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: redis-password
  namespace: stg
spec:
  vaultAuthRef: stg-auth
  type: kv-v2
  mount: secret
  path: data/redis
  destination:
    name: redis-password
    create: true
  refreshAfter: 60s
---
# Elasticsearch — dùng chung path monitoring/elasticsearch
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: elasticsearch-password
  namespace: stg
spec:
  vaultAuthRef: stg-auth
  type: kv-v2
  mount: secret
  path: monitoring/elasticsearch
  destination:
    name: elasticsearch-password
    create: true
  refreshAfter: 60s
