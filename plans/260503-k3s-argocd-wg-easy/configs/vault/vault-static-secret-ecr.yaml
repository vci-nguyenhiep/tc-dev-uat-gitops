---
# Thay thế configs/secrets/aws-ecr-credentials.yaml (manual Secret)
# ECR CronJob vẫn chạy bình thường — VSO chỉ sync AWS IAM credentials tĩnh
# ECR auth token (imagePullSecret) vẫn được refresh bởi ecr-token-refresh-cronjob
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: aws-ecr-credentials
  namespace: kube-system
spec:
  vaultAuthRef: kube-system-auth
  type: kv-v2
  mount: secret
  path: shared/aws-ecr
  destination:
    name: aws-ecr-credentials
    create: true
  refreshAfter: 300s
