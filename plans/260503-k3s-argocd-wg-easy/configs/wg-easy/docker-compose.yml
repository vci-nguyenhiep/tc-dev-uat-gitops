services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    restart: unless-stopped
    network_mode: host
    environment:
      # Domain hoặc IP public của server
      - WG_HOST=vpn.trungchinh.com.vn

      # Port WireGuard (UDP)
      - WG_PORT=51820

      # Template IP cho VPN clients
      - WG_DEFAULT_ADDRESS=10.8.0.x

      # DNS cho VPN clients
      - WG_DEFAULT_DNS=1.1.1.1,8.8.8.8

      # MTU (để mặc định hoặc điều chỉnh nếu có vấn đề)
      - WG_MTU=1420

      # Password hash (bcrypt) — KHÔNG dùng plain text PASSWORD
      # Sinh hash: htpasswd -bnBC 10 "" yourpassword | tr -d ':\n'
      - PASSWORD_HASH=$$2y$$10$$REPLACE_WITH_YOUR_BCRYPT_HASH

      # Port Web UI (chỉ dùng nội bộ, không expose ra Internet)
      - PORT=51821

    volumes:
      - ./wireguard-data:/etc/wireguard

    # network_mode: host => không dùng `ports:`. wg-easy tự bind:
    #   - UDP 51820 (WireGuard) trên mọi interface
    #   - TCP 51821 (Web UI) trên 0.0.0.0 — phải khoá bằng UFW (xem bước 3)
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    # KHÔNG set sysctls ở đây vì network_mode: host không cho phép.
    # Đã set trên host qua /etc/sysctl.d/99-wireguard.conf (xem phase-01).

    # Đảm bảo restart khi server reboot
    deploy:
      restart_policy:
        condition: always
