# IngressRoute CHỈ cho webhook GitHub — hở đúng path /api/webhook ra internet
#
# Tại sao tách riêng:
#   - IngressRoute chính (argocd-ingress.yaml) gắn middleware `vpn-only` → toàn bộ
#     UI/API admin chỉ vào được qua VPN. ĐÚNG, giữ nguyên.
#   - GitHub server nằm trên internet công cộng → không vào được endpoint vpn-only.
#   - Route này hở RIÊNG path /api/webhook (chỉ trigger refresh repo, không lộ data),
#     priority cao hơn route Host() đơn thuần để được match trước.
#
# Bảo mật endpoint này dựa vào webhook SECRET (HMAC X-Hub-Signature):
#   - ArgoCD verify chữ ký bằng `webhook.github.secret` trong secret argocd-secret.
#   - Request không có chữ ký đúng → ArgoCD reject. Secret mạnh là đủ.
#
# LƯU Ý về IP allowlist: KHÔNG dùng được trong cluster này vì klipper-lb MASQUERADE
# source IP (lý do vpn-only phải allow cả 10.42.0.0/16). Traefik không thấy IP thật
# của GitHub → ipAllowList theo IP GitHub sẽ chặn nhầm. Dựa vào secret là chính.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-webhook-ingressroute
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`tc-argocd.vcijsc.com`) && PathPrefix(`/api/webhook`)
      priority: 100          # cao hơn route Host() đơn thuần để win match
      # KHÔNG gắn vpn-only ở đây — GitHub (internet) phải gọi vào được
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: argocd-tls
