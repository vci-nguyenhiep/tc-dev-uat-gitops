apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-ingressroute
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`tc-argocd.vcijsc.com`)
      middlewares:
        - name: vpn-only
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: argocd-tls
