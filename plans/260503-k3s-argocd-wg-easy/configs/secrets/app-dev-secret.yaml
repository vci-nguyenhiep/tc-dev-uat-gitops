# CẢNH BÁO: Thay giá trị thực trước khi apply. KHÔNG commit lên Git.
# Secret dùng chung cho tất cả 5 apps trong namespace dev
# Chứa: DB password, Redis password, JWT secret, API keys...
apiVersion: v1
kind: Secret
metadata:
  name: app-dev-secret
  namespace: dev
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME_DEV_DB_PASSWORD
  REDIS_PASSWORD: CHANGE_ME_DEV_REDIS_PASSWORD
  JWT_SECRET: CHANGE_ME_JWT_SECRET_DEV
  # Thêm các biến môi trường nhạy cảm khác của app tại đây
