# CẢNH BÁO: Thay giá trị thực trước khi apply. KHÔNG commit lên Git.
# Secret dùng chung cho tất cả 5 apps trong namespace uat
apiVersion: v1
kind: Secret
metadata:
  name: app-uat-secret
  namespace: uat
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME_UAT_DB_PASSWORD
  REDIS_PASSWORD: CHANGE_ME_UAT_REDIS_PASSWORD
  JWT_SECRET: CHANGE_ME_JWT_SECRET_UAT
  # Thêm các biến môi trường nhạy cảm khác của app tại đây
