# CẢNH BÁO: Thay AWS credentials thực trước khi apply. KHÔNG commit lên Git.
# IAM User: k3s-ecr-puller (pull-only permissions)
apiVersion: v1
kind: Secret
metadata:
  name: aws-ecr-credentials
  namespace: kube-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: CHANGE_ME_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: CHANGE_ME_SECRET_ACCESS_KEY
  AWS_DEFAULT_REGION: ap-southeast-1
  ECR_REGISTRY: CHANGE_ME_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com
