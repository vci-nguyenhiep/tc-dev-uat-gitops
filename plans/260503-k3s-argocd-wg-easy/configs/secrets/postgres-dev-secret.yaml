# CẢNH BÁO: Thay password thực trước khi apply.
# KHÔNG commit file này lên Git sau khi đã điền password thật.
# Apply thủ công 1 lần: kubectl apply -f postgres-dev-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-dev-secret
  namespace: data
type: Opaque
stringData:
  POSTGRES_DB: devdb
  POSTGRES_USER: devuser
  POSTGRES_PASSWORD: CHANGE_ME_DEV_PASSWORD
